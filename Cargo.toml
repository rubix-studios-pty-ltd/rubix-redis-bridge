[package]
name = "rubix-redis-bridge"
version = "1.2.4"
authors = ["rubixvi"]
license = "MIT"
repository = "https://github.com/rubix-studios-pty-ltd/rubix-redis-bridge"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "tokio"] }
base64 = "0.23.1"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
prometheus = "0.14.0"
redis = { version = "1.7.1", features = ["aio", "tokio-comp", "connection-manager", "tokio-rustls-comp", "num-bigint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tower = { version = "0.5.3", features = ["limit"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
num-bigint = "0.5.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
